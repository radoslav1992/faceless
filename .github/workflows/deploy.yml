name: Deploy
# Production: the Worker and the renderer container, whose image is built here with Docker (Cloudflare's own builds
# deploy the Worker only). Runs on every push to main, after the same checks as CI, and by hand from the Actions tab
# (Run workflow). Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/DEPLOYMENT.md).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# One deploy at a time, in order; a newer push waits for the running one instead of cancelling it mid-rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (Settings → Secrets and variables → Actions), then run this workflow again. See docs/DEPLOYMENT.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Type check, lint, tests, build and the client bundle budget: nothing is deployed if they fail.
      - run: npm run ci
      # The Worker, then the renderer image (built with the runner's Docker, pushed to Cloudflare's registry) on every
      # container at once, so the Worker and the renderer stay in step.
      - run: npx wrangler deploy --containers-rollout=immediate
