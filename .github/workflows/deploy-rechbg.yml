name: Deploy Реч БГ
# Реч БГ, the second site built from this code (docs/SITES.md): its Worker (rech-bg), the renderer container and its
# database's migrations. By hand only (Actions → Deploy Реч БГ → Run workflow): a push to main deploys Hookstreak alone.
# Uses the same CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets as Deploy; the token must also cover D1 and the
# rechbg.com zone.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-rechbg
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (Settings → Secrets and variables → Actions), then run this workflow again."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The same checks as Hookstreak's deploy: nothing is deployed if they fail.
      - run: npm run ci
      - run: npm run build:rechbg
      # The schema first, then the Worker and the renderer image on every container at once.
      - run: npx wrangler d1 migrations apply rechbg --remote -c wrangler.rechbg.jsonc
      - run: npx wrangler deploy -c wrangler.rechbg.jsonc --containers-rollout=immediate
