name: Migrate
# Applies the D1 migrations (migrations/) that the production database `faceless` has not had yet, the same as
# `npm run db:remote` on a computer signed in to Cloudflare. By hand only (Actions → Migrate → Run workflow): some
# migrations must be applied before the code that uses them is deployed, others at a quiet moment (docs/DEPLOYMENT.md
# says which). Uses the same CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets as Deploy; the token needs
# D1 edit access.
on:
  workflow_dispatch:
permissions:
  contents: read
# Never at the same time as a deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (Settings → Secrets and variables → Actions), then run this workflow again. See docs/DEPLOYMENT.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # What is still to apply, then apply it (wrangler applies each migration in a transaction and records it), then
      # show that nothing is left.
      - run: npx wrangler d1 migrations list faceless --remote
      - run: npx wrangler d1 migrations apply faceless --remote
      - run: npx wrangler d1 migrations list faceless --remote
