<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d0c" />

    <title>You're offline · Hookstreak Shorts</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Shown by the service worker (public/sw.js) when a page can't load: self-contained, no app code. -->
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #0b0d0c; color: #f1f5f2;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 26px; margin: 20px 0 8px; letter-spacing: -0.02em; }
      p { color: #9aa49d; margin: 0 0 24px; }
      a { display: inline-block; padding: 12px 24px; border-radius: 999px; background: #b8f53a; color: #0c0d10; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Hookstreak Shorts needs a connection to load your videos. Check your connection and try again.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
